<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blockquote 引用块 · DocLight</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: var(--space-3); background: var(--color-bg); font-family: var(--font-body); color: var(--color-text); }
  .row { display: flex; gap: var(--space-3); align-items: flex-start; margin-bottom: var(--space-3); flex-wrap: wrap; }
  .label { flex: 0 0 92px; font-size: var(--font-size-caption); font-weight: var(--font-weight-eyebrow); line-height: var(--line-height-eyebrow); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-muted); padding-top: var(--space-3); }
  .rail { flex: 1 1 0; min-width: 0; }

  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .blockquote {
    margin: 0;
    padding: var(--space-4);
    background: var(--color-bg-quote);
    border-left: 4px solid var(--color-primary);
    border-radius: var(--radius-md);
    color: var(--color-text-secondary);
    font-size: var(--font-size-body);
    font-style: normal;
    line-height: var(--line-height-body);
  }
  .blockquote p { margin: 0; }

  .blockquote--cite {
    display: block;
    margin-top: var(--space-3);
    padding-left: var(--space-4);
    font-size: var(--font-size-caption);
    color: var(--color-text-muted);
    line-height: var(--line-height-caption);
  }

  .blockquote--large {
    font-size: var(--font-size-lead);
    line-height: var(--line-height-lead);
  }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row">
    <span class="label">默认引用</span>
    <div class="rail">
      <blockquote class="blockquote" data-evidence-sample="default">
        <p>把 Markdown 变成作品，是一件值得反复打磨的小事。</p>
      </blockquote>
    </div>
  </div>

  <div class="row">
    <span class="label">来源引用</span>
    <div class="rail">
      <blockquote class="blockquote" data-evidence-sample="cite">
        <p>简洁不是没东西可加，而是没东西可删。</p>
        <cite class="blockquote--cite">—— Antoine de Saint-Exupéry</cite>
      </blockquote>
    </div>
  </div>

  <div class="row">
    <span class="label">强调引用</span>
    <div class="rail">
      <blockquote class="blockquote blockquote--large" data-evidence-sample="large">
        <p>文档是思考的终点，也是协作的起点。</p>
      </blockquote>
    </div>
  </div>
</body>
</html>
